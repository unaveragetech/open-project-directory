name: Maintenance — reverification
on:
  schedule:
    - cron: "0 3 * * *"   # daily: HTTP + TLS checks
    - cron: "0 4 * * 0"   # weekly: full browser + documentation checks
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  reverify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Reverify all published projects
        run: python -m src.inspection.http_inspector --reverify-all
