name: Submission pipeline
# End-to-end lifecycle for one submission issue, all in this workflow:
#   1. parse + validate the issue body
#      -> acceptance comment (or an invalid comment listing exactly what
#         is missing/wrong), labels submitted -> queued
#   2. live inspection (HTTP/TLS, headless browser, documentation)
#      -> "inspection running" comment, then a detailed inspection comment
#         with the 0-100 score breakdown and the decision band
#   3. decision:
#      - auto-approve (85+): add the project to data/projects.json,
#        commit + push that change, build + deploy the site here in this
#        same workflow (a GITHUB_TOKEN push does NOT trigger the separate
#        publishing workflow), then post the live profile URL, label
#        `published`, and close the issue
#      - manual review (70-84): label `needs-review`, issue stays open
#      - request corrections (50-69) / reject (<50) / hard fail: detailed
#        denial comment, label `failed`, close the issue
#      - duplicate (already in data/projects.json): already-listed
#        comment with the live URL, label `published`, close — no
#        duplicate entry is ever added
# The logic lives in src/pipeline/process_issue.py, which reuses the
# existing parser / validator / normalizer / inspection / scoring /
# generator code. The separate inspection.yml and publishing.yml
# workflows still work unchanged (publishing also runs on any direct
# push to main that touches data/, templates/ or the generator).
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
# Concurrency: submission runs are serialized on their own group, NOT on
# the "pages" group and NOT on the github-pages environment. Two bugs
# found 2026-11-26, when 8 issues were submitted within 30 seconds:
#   1. jobs targeting the github-pages environment cancel earlier pending
#      runs for that environment — 6 of 8 runs were cancelled before
#      they posted a single comment;
#   2. two runs that both scored auto_approve pushed catalog changes
#      from a stale checkout, so the second push was rejected
#      (non-fast-forward) and its project never published.
# Serializing here (cancel-in-progress: false) plus a rebase before the
# push fixes both. The deploy-pages step works without an environment
# block; it just does not record an environment deployment.
concurrency:
  group: "submission-pipeline"
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Process submission issue
        id: process
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m src.pipeline.process_issue \
            --issue-number "${{ github.event.issue.number }}" --phase process
          # process_issue writes outcome=<...> to $GITHUB_OUTPUT itself,
          # which is how the steps below know whether to publish.
      - name: Commit catalog change
        if: steps.process.outputs.outcome == 'publish'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit first, THEN rebase onto the latest main, then push.
          # (Pulling before the commit fails: the catalog change is still
          # uncommitted at that point and git refuses to rebase with
          # unstaged changes — that broke the PagesXcrawler publish on
          # 2026-11-26 even though it scored 100/100. The rebase itself
          # is still needed: another run may have pushed a catalog change
          # after this run checked out, and a stale push is rejected
          # (non-fast-forward) — that killed the first Seaflare publish.)
          git add data/projects.json
          git commit -m "Add project from submission #${{ github.event.issue.number }}"
          git pull --rebase origin main
          git push
      - name: Build static site
        if: steps.process.outputs.outcome == 'publish'
        run: |
          python -m src.publishing.generator --data data/projects.json --out site
          python -c "from src.publishing.deployer import validate_site_output; ok, errs = validate_site_output('site'); print(errs); raise SystemExit(0 if ok else 1)"
      - uses: actions/configure-pages@v5
        if: steps.process.outputs.outcome == 'publish'
      - uses: actions/upload-pages-artifact@v3
        if: steps.process.outputs.outcome == 'publish'
        with:
          path: site
      - name: Wait for Pages artifact
        if: steps.process.outputs.outcome == 'publish'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # deploy-pages queries the artifact list the instant the upload
          # finishes, and that list is eventually consistent: twice on
          # 2026-11-26 (Datamore, Copperhead) it answered "0 artifacts"
          # under a second after a successful upload and failed the
          # deploy. Poll until the github-pages artifact is visible.
          python3 - <<'PY'
          import json, os, time, urllib.request
          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts"
          for attempt in range(24):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  names = [a["name"] for a in json.load(resp).get("artifacts", [])]
              if "github-pages" in names:
                  print("github-pages artifact visible after", attempt * 5, "s")
                  break
              time.sleep(5)
          else:
              raise SystemExit("github-pages artifact never appeared")
          PY
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.process.outputs.outcome == 'publish'
        uses: actions/deploy-pages@v4
      - name: Post published comment, label and close
        if: steps.process.outputs.outcome == 'publish'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m src.pipeline.process_issue \
            --issue-number "${{ github.event.issue.number }}" --phase finalize
