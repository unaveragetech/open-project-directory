name: Publishing — GitHub Pages
# Builds site/ with the generator and deploys it to GitHub Pages.
# Production host is GitHub Pages (Jesse's direction, 2026-11-25):
# https://unaveragetech.github.io/open-project-directory/
# Inspection stays separate (inspection.yml); this workflow only builds
# and publishes already-approved listings.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "templates/**"
      - "static/**"
      - "src/publishing/**"
      - "src/advertising/**"
      - "config/**"
      - ".github/workflows/publishing.yml"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number just published (optional, for the log)"
        required: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build static site
        run: python -m src.publishing.generator --data data/projects.json --out site
      - name: Validate built site
        run: python -c "from src.publishing.deployer import validate_site_output; ok, errs = validate_site_output('site'); print(errs); raise SystemExit(0 if ok else 1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
